<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe — Game Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">🎮 Game Arcade</a>
    <nav>
      <a href="home.html">Home</a>
      <a href="#">My Games</a>
    </nav>
  </header>

  <main class="game-page">
    <a href="home.html">← Back to games</a>
    <h2>Tic-Tac-Toe</h2>
    <p id="status">X's turn</p>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button id="restart" class="btn primary">Restart Game</button>
    <p id="history-note" class="note"></p>
  </main>

  <script src="tictactoe.js"></script>
</body>
</html>
