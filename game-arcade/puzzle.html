<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Puzzle — Game Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">🎮 Game Arcade</a>

  </header>
  <main class="game-page">
    <a href="home.html">← Back to games</a>
    <h2>Sliding Puzzle</h2>
