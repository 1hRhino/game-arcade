<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Games — Game Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">🎮 Game Arcade</a>
    <nav><a href="home.html">Home</a><a href="my-games.html">My Games</a></nav>
  </header>
  <main class="game-page">
    <a href="home.html">← Back to games</a>
    <h2>My Games</h2>
    <p id="subtitle" class="note"></p>
    <div id="games-list"></div>
    <button id="clear" class="btn guest">Clear History</button>
  </main>
  <script>
    const list = document.getElementById('games-list');
    const subtitle = document.getElementById('subtitle');
    const session = JSON.parse(localStorage.getItem('gameArcadeSession') || 'null');
    const history = JSON.parse(localStorage.getItem('gameArcadeHistory') || '[]').reverse();
    subtitle.textContent = session
      ? `Signed in as ${session.name} — ${history.length} game(s) played.`
      : 'Playing as guest — these games are only saved in this browser.';
    if (!history.length) {
      list.innerHTML = '<p class="note">No games yet. Go play one!</p>';
    } else {
      list.innerHTML = history.map(g => `
        <div class="game-card" style="text-align:left; margin-bottom:12px;">
          <h3>${g.game}</h3>
          <p>${g.result}</p>
          <p>${new Date(g.date).toLocaleString()}</p>
        </div>`).join('');
    }
    document.getElementById('clear').addEventListener('click', () => {
      localStorage.removeItem('gameArcadeHistory');
      location.reload();
    });
  </script>
</body>
</html>
